# Settings for scripts/rules-check.sh (plain shell variables). Fill in on the day.

# Competition window, Astana time, format "YYYY-MM-DD HH:MM" (rules 5.3.1, 5.4.13).
# Before the start only setup files should be committed; the 18:00 repo state is the final version.
COMPETITION_START="2026-09-23 13:00"
COMPETITION_END="2026-09-23 18:00"

# Text that the team repo's 'origin' URL must contain, e.g. the organization or repo name.
REPO_REMOTE_PATTERN="BAITC-Hacks/hack-77644574-rassengan"

# Rules require a confirmed result every hour of the competition.
HOURLY_MAX_MIN=60

# A single commit adding at least this much non-setup code triggers a "large drop" warning.
LARGE_COMMIT_LINES=1500
LARGE_COMMIT_FILES=40

<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подбор подрядчиков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2f2;--surface:#fff;--ink:#201e1d;--muted:#5c5855;--line:#d4d0cd;--accent:#ec3013;--accent-600:#c92608;--accent-700:#a31f07;--accent-100:#fde5e0;
--ok:#1b6a34;--ok-bg:#e1f0e4;--warn:#7f5200;--warn-bg:#fbeecd;--warn-line:#d99a1e;--neutral:#3d3a38;--neutral-bg:#e4e2e0;--ai:#1d4ea3;--ai-bg:#e1eafa;
--font:"Archivo",system-ui,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font:17px/1.5 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
::selection{background:var(--accent-100)}
a{color:var(--accent-700)}a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{border-bottom:2px solid var(--ink);padding:36px 48px 28px;display:grid;gap:8px}
.top h1{margin:0;font-size:clamp(36px,3.4vw,54px);line-height:1.02;font-weight:800;letter-spacing:-.025em}
.top p{margin:0;font-size:clamp(17px,1.25vw,21px);color:var(--muted);max-width:60ch;text-wrap:pretty}
.layout{display:grid;grid-template-columns:minmax(400px,480px) minmax(0,1fr);min-height:calc(100vh - 150px)}
.panel{border-right:2px solid var(--ink);background:var(--surface)}
.step{padding:28px 32px 32px}
.step+.step{border-top:2px solid var(--ink)}
.kicker{display:flex;gap:12px;align-items:baseline;margin:0 0 16px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kicker b{color:var(--accent);font-weight:800}
label{display:grid;gap:6px;font-size:14px;font-weight:600;color:var(--ink)}
input,select,textarea{font:inherit;font-size:16px;font-weight:400;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:0;padding:10px 12px;width:100%;min-width:0;transition:border-color .12s}
input:hover,select:hover,textarea:hover{border-color:#a9a4a0}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea{resize:vertical;line-height:1.45;min-height:96px}
.missing{border-color:var(--warn-line)!important;background:var(--warn-bg)}
#parse-form{display:grid;gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:16px;font-weight:600;cursor:pointer;border-radius:0;border:2px solid var(--ink);padding:11px 16px;display:inline-flex;align-items:center;justify-content:flex-start;gap:12px;text-align:left;background:var(--surface);color:var(--ink);transition:background .12s,color .12s,border-color .12s}
button:disabled{opacity:.45;cursor:not-allowed}
#parse-button{background:var(--ink);color:#fff;min-width:170px;justify-content:space-between}
#parse-button:not(:disabled):hover{background:#000}
#example-button{border-color:transparent;background:transparent;color:var(--accent-700);padding-left:8px;padding-right:8px;font-size:15px}
#example-button:hover{background:var(--accent-100)}
#parse-status{display:grid;gap:4px;font-size:15px;color:var(--muted)}
#parse-status:empty{display:none}
#parse-status p{margin:0}
#form{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
#form label:has([name=budget_kzt]),#form label:has([name=hours]){grid-column:span 1}
#form button[type=submit]{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:#fff;font-size:18px;padding:15px 18px;justify-content:space-between;margin-top:6px}
#form button[type=submit]:not(:disabled):hover{background:var(--accent-600);border-color:var(--accent-600)}
#form button[type=submit]:not(:disabled):active{background:var(--accent-700)}
#form button[type=submit]::after{content:"→";font-size:20px;line-height:1}
button.loading:disabled{opacity:1;cursor:progress}
button.loading::after,#form button[type=submit].loading::after{content:"";width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-bottom-color:transparent;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
#results{padding:32px 48px 64px;counter-reset:rank;display:flex;flex-direction:column;gap:16px;max-width:1200px}
#results:empty::before{content:"Опишите заказ или заполните параметры слева — подходящие подрядчики появятся здесь.";display:block;border-top:2px solid var(--ink);padding-top:20px;color:var(--muted);font-size:20px;max-width:36ch}
#results>p{margin:0;font-size:17px}
#results>p.pending{position:relative;overflow:hidden;border-top:2px solid var(--ink);padding-top:20px;font-size:22px;font-weight:600}
#results>p.pending::after{content:"";position:absolute;top:-2px;left:0;width:25%;height:2px;background:var(--accent);animation:slide 1.1s ease-in-out infinite}
#results>h2{margin:0;font-size:clamp(24px,1.9vw,32px);line-height:1.2;font-weight:700;letter-spacing:-.01em;padding:20px 24px;border-top:4px solid var(--neutral);background:var(--neutral-bg);color:var(--neutral);text-wrap:pretty}
#results>h2.tone-ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
#results>h2.tone-warn{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn)}
#results>p.why{margin-top:-16px;padding:0 24px 18px;background:var(--warn-bg);color:var(--warn);font-size:17px}
article{counter-increment:rank;display:grid;grid-template-columns:64px minmax(0,1fr) auto;column-gap:24px;background:var(--surface);border-top:2px solid var(--ink);padding:24px 28px 20px 24px}
article::before{content:counter(rank);grid-column:1;grid-row:1/span 6;font-size:56px;font-weight:800;line-height:.9;color:var(--accent);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
article h3{grid-column:2;grid-row:1;margin:0;font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
article p.meta{display:contents}
article .where{grid-column:2;grid-row:2;color:var(--muted);font-size:16px;margin-top:2px}
article .sep{display:none}
article .flags .sep{display:none}
article .price{grid-column:3;grid-row:1/span 2;align-self:start;text-align:right;font-size:26px;font-weight:800;letter-spacing:-.015em;white-space:nowrap;font-variant-numeric:tabular-nums}
article .price.unknown{font-size:16px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:6px 10px;white-space:normal;max-width:180px}
article p.flags{grid-column:2/-1;grid-row:3;margin:14px 0 0;display:flex;flex-wrap:wrap;gap:6px}
article .flag{font-size:13px;font-weight:600;padding:3px 8px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
article p.explanation{grid-column:2/-1;grid-row:4;margin:16px 0 0;font-size:19px;line-height:1.55;max-width:68ch;text-wrap:pretty}
article .explanation-badge{grid-column:2/-1;grid-row:5;justify-self:start;margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;background:var(--neutral-bg);color:var(--neutral)}
article .explanation-badge.ai{background:var(--ai-bg);color:var(--ai)}
article .explanation-badge[title]{cursor:help}
article details{grid-column:2/-1;grid-row:6;margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;font-size:15px;font-weight:600;color:var(--ink);padding:4px 0;width:max-content;max-width:100%}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";display:inline-grid;place-items:center;width:20px;height:20px;border:2px solid var(--ink);font-size:15px;line-height:1;font-weight:700;flex:none}
details[open]>summary::before{content:"−"}
summary:hover{color:var(--accent-700)}
article details[open]{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:24px}
article details[open] summary{grid-column:1/-1;margin-bottom:6px}
article details p{margin:0;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
details.trace{margin-top:8px;border-top:2px solid var(--ink);padding-top:14px}
details.trace>summary{font-size:16px}
details.trace[open]{display:grid}
details.trace p{margin:0;display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
details.trace p:first-of-type{margin-top:8px}
details.trace p::before{content:"";width:8px;height:8px;flex:none;background:var(--muted);transform:translateY(-1px)}
details.trace p.passed::before{background:var(--ok)}
details.trace p.rejected{color:var(--muted)}
@media (max-width:1000px){.layout{grid-template-columns:1fr}.panel{border-right:0;border-bottom:2px solid var(--ink)}#results{padding:24px}.top{padding:28px 24px 22px}.step{padding:24px}}
@media (max-width:600px){article{display:block;padding:20px}article::before{display:block;font-size:40px;margin-bottom:8px}article h3{font-size:20px}article .where,article .price{display:block;text-align:left}article .price{font-size:20px;margin:4px 0 0}}
@media (min-width:1600px){body{font-size:18px}article p.explanation{font-size:20px}}
</style>
<header class="top">
<h1>Подбор подрядчиков</h1>
<p>Помогаем выбрать из каталога — с объяснением, почему именно эти подрядчики</p>
</header>
<main class="layout">
<aside class="panel">
<div class="step">
<p class="kicker"><b>01</b>Опишите заказ текстом</p>
<form id="parse-form">
<label>Опишите заказ своими словами<textarea id="order-text" rows="3" maxlength="500" required placeholder="Нужен ведущий на казахском на той 15 октября в Алматы, бюджет до 1 миллиона"></textarea></label>
<div class="actions">
<button type="submit" id="parse-button" disabled>Разобрать</button>
<button type="button" id="example-button">Пример</button>
</div>
<div id="parse-status" aria-live="polite"></div>
</form>
</div>
<div class="step">
<p class="kicker"><b>02</b>Проверьте параметры</p>
<form id="form">
<label>Город<select name="city" required></select></label>
<label>Дата<input name="date" type="date" min="2026-09-23" max="2026-12-31" value="2026-10-15" required></label>
<label>Тип мероприятия<select name="event_type" required></select></label>
<label>Категория<select name="category" required></select></label>
<label>Бюджет, ₸<input name="budget_kzt" type="number" min="0" step="1" value="1000000" required></label>
<label>Длительность, ч (необязательно)<input name="hours" type="number" min="0.1" step="any"></label>
<label>Язык (необязательно)<select name="language"></select></label>
<button type="submit">Подобрать</button>
</form>
</div>
</aside>
<section id="results" aria-live="polite"></section>
</main>
<script>
const form=document.getElementById('form'), results=document.getElementById('results');
function add(parent,tag,text,className){const el=document.createElement(tag);el.textContent=text;if(className)el.className=className;parent.append(el);return el;}
function setLoading(button,on){button.classList.toggle('loading',on);if(on)button.setAttribute('aria-busy','true');else button.removeAttribute('aria-busy');}
async function loadOptions(){
 const button=form.querySelector('button');button.disabled=true;
 try{const response=await fetch('/options');if(!response.ok)throw new Error('Не удалось загрузить каталог.');
 const data=await response.json();
 for(const [field,key] of Object.entries({city:'cities',category:'categories',event_type:'event_formats',language:'languages'})){
 const select=form.elements[field];select.replaceChildren();
 if(field==='language'){const option=add(select,'option','Любой');option.value='';}
 for(const value of data[key]){const option=add(select,'option',value);option.value=value;}
 }
 for(const [field,value] of Object.entries({city:'Алматы',category:'Ведущий',event_type:'свадьба'})){
 if([...form.elements[field].options].some(option=>option.value===value))form.elements[field].value=value;
 }
 button.disabled=false;document.getElementById('parse-button').disabled=false;
 }catch(error){add(results,'p',error.message+' Обновите страницу, чтобы повторить.');}
}
loadOptions();
document.getElementById('example-button').addEventListener('click',()=>{
 const textarea=document.getElementById('order-text');
 textarea.value='Нужен ведущий на казахском на той 15 октября в Алматы, бюджет до 1 миллиона';
 textarea.focus();
});
const fieldLabels={city:'Город',date:'Дата',event_type:'Тип мероприятия',category:'Категория',budget_kzt:'Бюджет',hours:'Длительность',language:'Язык'};
form.addEventListener('input',event=>{event.target.classList.remove('missing');event.target.removeAttribute('aria-invalid');});
document.getElementById('parse-form').addEventListener('submit',async event=>{
 event.preventDefault();
 const button=document.getElementById('parse-button'),status=document.getElementById('parse-status');
 const text=document.getElementById('order-text').value.trim();
 status.replaceChildren();
 if(!text){add(status,'p','Введите описание заказа.');return;}
 button.disabled=true;setLoading(button,true);add(status,'p','Разбираем…');
 try{
 const response=await fetch('/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
 const data=await response.json();
 if(!response.ok)throw new Error(response.status===422?'Введите описание от 1 до 500 символов.':'Не удалось разобрать текст.');
 if(data.error)throw new Error(data.error);
 for(const field of Object.keys(fieldLabels)){
 const input=form.elements[field];input.value=data.fields[field]??'';
 const missing=data.missing.includes(field);input.classList.toggle('missing',missing);
 if(missing)input.setAttribute('aria-invalid','true');else input.removeAttribute('aria-invalid');
 }
 results.replaceChildren();status.replaceChildren();
 if(data.missing.length)add(status,'p','Уточните: '+data.missing.map(field=>fieldLabels[field]||field).join('; '));
 add(status,'p','Проверьте поля формы и нажмите «Подобрать».');
 }catch(error){status.replaceChildren();add(status,'p',error.message||'Ошибка соединения.');}
 finally{button.disabled=false;setLoading(button,false);}
});
const scoreLabels={event_relevance:'Формат в описании',category_relevance:'Категория в описании',language:'Языки',hours_headroom:'Запас часов',value_for_money:'Цена',data_quality:'Качество данных'};
form.addEventListener('submit',async event=>{
 event.preventDefault();results.replaceChildren();add(results,'p','Подбираем…','pending');form.querySelector('button').disabled=true;setLoading(form.querySelector('button'),true);
 const request=Object.fromEntries(new FormData(form));request.budget_kzt=Number(request.budget_kzt);request.hours=request.hours?Number(request.hours):null;request.language=request.language||null;
 try{const response=await fetch('/match',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});
 if(response.status===422){
 const error=await response.json();
 const message=Array.isArray(error.detail)?error.detail.map(item=>item.msg).filter(Boolean).join(' '):error.detail;
 throw new Error(typeof message==='string'&&message?message:'Проверьте поля формы.');
 }
 if(!response.ok)throw new Error('Не удалось выполнить подбор.');
 const data=await response.json();results.replaceChildren();
 const tone=data.outcome==='found'?(data.cards.length>=3?'tone-ok':'tone-warn'):'tone-neutral';
 add(results,'h2',data.message,tone);
 if(data.outcome==='found'&&data.why_fewer_than_3&&data.why_fewer_than_3!==data.message)add(results,'p',data.why_fewer_than_3,'why');
 for(const card of data.cards){const article=add(results,'article','');add(article,'h3',card.name);
 const meta=add(article,'p','','meta');add(meta,'span',card.category+' · '+card.city,'where');add(meta,'span',' · ','sep');add(meta,'span',card.price_unknown?'Цена требует уточнения':'от '+card.price_from_kzt.toLocaleString('ru-RU')+' ₸',card.price_unknown?'price unknown':'price');
 const flags=[];if(card.synthetic)flags.push('Синтетический профиль');if(card.city_imputed)flags.push('Город проставлен при подготовке данных');if(card.price_imputed)flags.push('Цена проставлена при подготовке данных');
 if(flags.length){const flagsEl=add(article,'p','','flags');flags.forEach((flag,i)=>{if(i)add(flagsEl,'span',' · ','sep');add(flagsEl,'span',flag,'flag');});}
 add(article,'p',card.explanation,'explanation');
 const badge=add(article,'span',card.explanation_source==='llm'?(card.explanation_attempts===2?'AI-объяснение (исправлено)':'AI-объяснение'):'шаблон','explanation-badge'+(card.explanation_source==='llm'?' ai':' template'));if(card.fallback_reason)badge.title=card.fallback_reason;
 const details=add(article,'details','');add(details,'summary','Расчёт оценки: '+card.score);
 for(const [key,points] of Object.entries(card.score_breakdown))add(details,'p',(scoreLabels[key]||key)+': '+points);
 }
 if(data.trace&&data.trace.length){const trace=add(results,'details','','trace');add(trace,'summary','Проверка всех кандидатов ('+data.candidate_count+')');
 for(const candidate of data.trace)add(trace,'p',candidate.id+' · '+candidate.name+' — '+(candidate.status==='passed'?'Проходит; оценка '+candidate.score:'Отклонён: '+candidate.reason),candidate.status==='passed'?'passed':'rejected');}
 }catch(error){results.replaceChildren();add(results,'p',error.message||'Ошибка соединения.');}finally{form.querySelector('button').disabled=false;setLoading(form.querySelector('button'),false);}
});
</script>
</html>
